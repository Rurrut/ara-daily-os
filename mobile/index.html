<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f6f2"><title>Aiary</title><link rel="stylesheet" href="mobile.css"></head><body>
<header class="top"><div class="datebar"><button id="previous" aria-label="이전 날">‹</button><input id="date" type="date" aria-label="날짜"><button id="next" aria-label="다음 날">›</button><button id="today">오늘</button><button id="planOpen" class="plan-trigger" aria-label="계획 편집">계획</button></div><div class="overview"><div><span class="metric-label"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 15h18M5 15a7 7 0 0 1 14 0M12 3v3M5.6 6.6l2.1 2.1M18.4 6.6l-2.1 2.1"/></svg>기상</span><strong id="wake">—</strong></div><div><span class="metric-label"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6a8.5 8.5 0 1 0 11.8 11.8Z"/></svg>수면 예상</span><strong id="sleep">—</strong></div><div class="scorecard focus-card"><span class="metric-label"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>집중</span><strong id="total">0<span>점</span></strong></div><div class="scorecard satisfaction-card"><span class="metric-label"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.4 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>만족도</span><strong id="satisfactionTotal">— /5</strong></div><div class="scorecard adherence-card" id="adherenceCard" role="button" tabindex="0" aria-label="이행도 상세"><span class="metric-label"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="m7.5 12.2 3 3 6-6"/></svg>이행</span><strong id="adherenceTotal">—</strong></div></div><div class="color-tabs" role="tablist" aria-label="시간표 색상 보기"><button id="colorCategory" role="tab" aria-selected="true">카테고리</button><button id="colorFocus" role="tab" aria-selected="false">집중</button><button id="colorSatisfaction" role="tab" aria-selected="false">만족도</button></div><div id="colorLegend" class="color-legend">카테고리별 색상</div><div class="minutes"><span></span><span>00</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div></header>
<div class="ara-stage"><aside id="araGuide" class="ara-guide" aria-live="polite" hidden></aside><button id="araAvatar" class="ara-avatar" type="button" aria-label="아라 안내" aria-controls="araGuide" aria-expanded="false"></button></div>
<main id="timeline" aria-label="계획과 실제 시간표"></main><p id="empty" class="empty">기상을 기록하고 오늘의 하루를 시작하세요.</p>
<button id="checklistToggle" class="checklist-toggle" aria-label="오늘 체크리스트" aria-expanded="false" aria-controls="checklistPanel">☑</button>
<aside id="checklistPanel" class="checklist-panel" aria-label="오늘 체크리스트" hidden><div class="checklist-heading"><strong>할 일 <small id="checklistSummary"></small></strong><button id="checklistClose" aria-label="체크리스트 닫기">×</button></div><div id="checklistItems"></div><button id="checklistAdd">＋ 할 일 추가</button></aside><div id="taskDragHint" role="status" hidden></div>
<div id="resizeHint" hidden></div><div id="toast" role="status"></div><span id="selectionText" class="sr-only" aria-live="polite"></span><span id="syncnote" class="sr-only" role="status"></span><button id="undo" class="undo-fab" aria-label="되돌리기 (Ctrl+Z)" title="되돌리기 (Ctrl+Z)" disabled>↶</button>
<button id="settings" class="settings-fab" aria-label="설정" title="설정">⚙<i hidden></i></button>
<nav id="blockMenu" class="block-menu" aria-label="선택한 시간 편집" hidden><button id="closeContext" class="context-close" aria-label="메뉴 닫기">×</button><div id="contextBody"></div></nav>
<div id="shade" hidden></div><section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"><div class="sheet-grip"></div><div class="sheet-title"><h2 id="sheetTitle"></h2><button id="closeSheet" aria-label="닫기">×</button></div><div id="sheetBody"></div></section>
<script src="offline-core.js"></script><script src="mobile.js"></script></body></html>
