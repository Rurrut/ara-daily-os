name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node mobile/tests.cjs
      - run: node mobile/fixed-sleep-tests.cjs
      - run: node mobile/prep-record-tests.cjs
      - run: node mobile/satisfaction-tests.cjs
      - run: node mobile/yogurt-gap-tests.cjs
      - run: node mobile/checklist-tests.cjs
      - run: node mobile/preview-tests.cjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Windows app
        shell: powershell
        run: .\Build.ps1
