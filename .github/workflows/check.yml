name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node mobile/tests.cjs
      - run: node mobile/fixed-sleep-tests.cjs
      - run: node mobile/prep-record-tests.cjs
      - run: node mobile/satisfaction-tests.cjs
      - run: node mobile/yogurt-gap-tests.cjs
      - run: node mobile/checklist-tests.cjs
      - run: node mobile/preview-tests.cjs
      - run: node engine/tests.cjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Match current Korean routine fixture timezone
        shell: powershell
        run: tzutil /s "Korea Standard Time"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Build Windows app
        shell: powershell
        run: .\Build.ps1
      - name: Test Windows shared engine and storage
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:exe /out:EngineContracts.exe '/reference:ARA Daily OS.exe' engine\WindowsContracts.cs
          if ($LASTEXITCODE -ne 0) { throw 'Contract harness build failed' }
          & .\EngineContracts.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows contracts failed' }
