<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aiary 화면·계획 시안</title><style>
:root{--bg:#f7f4e9;--ink:#344335;--surface:#fffdf5;--line:#d6dccb;--accent:#739957;--plan:#f1f0e6;--actual:#e4ecdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui}body.dark{--bg:#111d17;--ink:#e5ecdf;--surface:#1d2d23;--line:#3e5340;--plan:#233025;--actual:#263e32}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:8px 12px}header{position:sticky;top:0;z-index:2;background:var(--bg);padding:18px 10px 6px;border-bottom:1px solid var(--line)}main,header{max-width:560px;margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.brand{font-weight:800;font-size:19px}.brand em{color:var(--accent);font-style:normal}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:12px 0}.stats div{padding:8px 5px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}small{font-size:10px;opacity:.75;display:block}.stats strong{font-size:16px}.tabs{display:flex;gap:5px}.tabs button{flex:1;padding:7px}.tabs .active{background:var(--accent);color:white}.mins{display:grid;grid-template-columns:30px repeat(6,1fr);text-align:center;font-size:11px;opacity:.7;margin-top:8px}.hour{display:grid;grid-template-columns:30px 1fr;padding:6px 5px;margin:6px 8px;border:1px solid var(--line);border-radius:17px;background:var(--surface)}.time{font-size:19px;align-self:center}.lane{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;position:relative}.lane+.lane{margin-top:4px}.cell{height:24px;border:1px solid var(--line);border-radius:9px;background:var(--plan);font-size:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}.actual .cell{height:34px;background:var(--actual)}.activity{grid-row:1;display:flex;align-items:center;justify-content:space-between;padding:3px 9px;background:#eed8a4;color:#4c482f;border:1px solid #c4ad77;border-radius:11px;font-size:11px}.activity small{font-size:9px}.gauge{letter-spacing:1px;color:#638b46}.now{outline:2px solid var(--accent)}footer{height:90px}.floating{position:fixed;right:12px;bottom:82px;display:flex;align-items:end;gap:10px;z-index:3}.face{width:58px;height:58px;padding:0;border-radius:50%;background-image:url('ui-assets/ara-sheet.png');background-size:567px 411px;background-position:-214px -296px}.bubble{max-width:230px;background:var(--surface);border:1px solid var(--accent);border-radius:20px;padding:12px;font-size:12px;box-shadow:0 3px 12px #0002}.bottom{position:fixed;bottom:16px;right:14px;display:flex;gap:8px}.bottom button{border-radius:50%;width:44px;height:44px;background:var(--accent);color:white}dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);width:min(440px,94vw);padding:20px}dialog::backdrop{background:#0007}label{display:block;margin:12px 0}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}.note{font-size:11px;opacity:.65;margin:8px}.preview{color:var(--accent);font-size:11px}button:focus-visible{outline:3px solid var(--accent)}
</style><header><div class="bar"><span class="brand"><em>✿</em> Aiary</span><span>11월 4일 · 수</span><button onclick="planner.showModal()">계획</button><button aria-label="테마 전환" onclick="document.body.classList.toggle('dark')">◐</button></div><div class="stats"><div><small>기상</small><strong>08:00</strong></div><div><small>수면 예상</small><strong>00:30</strong></div><div><small>집중</small><strong>3.4</strong></div><div><small>만족도</small><strong>3.8/5</strong></div><div><small>이행</small><strong>7</strong></div></div><div class="tabs"><button class="active">카테고리</button><button>집중</button><button>만족도</button></div><div class="mins"><span></span><span>00</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div></header><main id="timeline"></main><footer><p class="note">설계 시안 · 예시 데이터 · 실제 기록을 저장하지 않습니다.</p></footer><div class="floating"><div class="bubble" id="bubble">지난 시간은 어떻게 보내셨어요?<br>기록할 칸을 골라 주세요.</div><button class="face" aria-label="아라 말풍선 접기" onclick="bubble.hidden=!bubble.hidden"></button></div><div class="bottom"><button onclick="alert('실제 앱에서는 마지막 명령을 되돌립니다.')">↶</button><button onclick="planner.showModal()">＋</button></div><dialog id="planner"><div class="bar"><strong>오늘 계획</strong><button onclick="planner.close()">닫기</button></div><p class="preview">선택한 계획 칸에 활동을 추가하는 시안</p><label>활동<input id="activity" value="집중 학습"></label><label>카테고리<select><option>학습</option><option>작업</option><option>휴식</option></select></label><label>시작<select id="hour"></select></label><label>길이<select id="duration"><option value="2">20분</option><option value="3" selected>30분</option><option value="6">1시간</option></select></label><p class="note">실제 앱 연결 시 충돌과 이후 조정 내용을 먼저 보여주고 적용합니다. 저장·실행취소는 기존 엔진 명령을 사용합니다.</p><button onclick="addPlan()">시안에 적용</button></dialog><script>
const plans={8:['기상','','준비','1끼니','1끼니','1끼니'],10:['','','','존2','존2','존2'],11:['존2','샤워','샤워','','',''],12:['','','준비','2끼니','2끼니','2끼니']};
for(let h=8;h<23;h++){const row=document.createElement('section');row.className='hour'+(h===14?' now':'');row.innerHTML='<div class="time">'+h+'<small>시</small></div><div><div class="lane plan" id="plan'+h+'">'+Array.from({length:6},(_,i)=>'<div class="cell">'+(plans[h]?.[i]||'')+'</div>').join('')+'</div><div class="lane actual">'+Array.from({length:6},()=>'<div class="cell"></div>').join('')+'</div></div>';timeline.append(row);const o=document.createElement('option');o.value=h;o.textContent=h+':00';hour.append(o)}hour.value=14;
for(const [h,start,n,title]of [[8,3,3,'1끼니'],[9,0,6,'작업'],[12,3,3,'2끼니']]){const lane=document.querySelectorAll('.hour')[h-8].querySelector('.actual');lane.innerHTML='';for(let i=0;i<start;i++)lane.innerHTML+='<div class="cell"></div>';const b=document.createElement('div');b.className='activity';b.style.gridColumn=(start+1)+' / span '+n;b.innerHTML='<span>'+title+'<small>'+h+':'+(start*10).toString().padStart(2,'0')+' · '+n*10+'분</small></span><span>☺ <span class="gauge">●●●○○</span></span>';lane.append(b)}
function addPlan(){const lane=document.getElementById('plan'+hour.value);for(let i=0;i<Number(duration.value);i++){lane.children[i].textContent=activity.value||'활동';lane.children[i].style.background='var(--actual)'}planner.close()}
</script></html>
